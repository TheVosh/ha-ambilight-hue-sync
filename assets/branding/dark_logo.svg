  <rect x="91" y="40" width="72" height="17" rx="9" fill="#FFA80D"/>
  <circle cx="100" cy="48" r="5" fill="#FFCF5B" opacity=".8" filter="url(#highlight)"/>
<circle cx="100" cy="48" r="2" fill="#FFCF5B"/>
  <circle cx="153" cy="49" r="5" fill="#FFCF5B" opacity=".8" filter="url(#highlight)"/>
<circle cx="153" cy="49" r="2" fill="#FFCF5B"/>
</g>
<path d="M211 79 Q221 127 211 171" fill="none" stroke="#09B1D2" stroke-width="15" stroke-linecap="round"/>
<circle cx="38" cy="87" r="5" fill="#FF67C2" opacity=".8" filter="url(#highlight)"/>
<circle cx="38" cy="87" r="2" fill="#FF67C2"/>
<circle cx="211" cy="162" r="5" fill="#64E7F2" opacity=".8" filter="url(#highlight)"/>
<circle cx="211" cy="162" r="2" fill="#64E7F2"/>
