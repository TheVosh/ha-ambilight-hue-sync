  <ellipse cx="130" cy="80" rx="58" ry="28" fill="#FFA80D"/>
  <ellipse cx="184" cy="132" rx="33" ry="59" fill="#09B1D2"/>
</g>
<g filter="url(#active)" opacity=".9">
