<text x="230" y="104" fill="#EDF3FA" font-family="Arial, DejaVu Sans, sans-serif" font-size="62" font-weight="700">Ambilight</text>
<text x="230" y="166" fill="#B8C6D9" font-family="Arial, DejaVu Sans, sans-serif" font-size="52">Hue Sync</text>
